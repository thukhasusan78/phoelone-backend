name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libopus-dev
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and contract tests
        env:
          DATABASE_URL: memory://
          ALLOW_AUTO_PROVISION: "true"
          GEMINI_API_KEYS: test
          AUTH_PEPPER: ci-pepper
        run: pytest -q tests/unit tests/contract tests/integration tests/load
