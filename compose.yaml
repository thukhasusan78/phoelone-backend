# Optional Docker Compose stack. This VPS runs the native systemd path in README.md.
# If you use Compose, set API_UPSTREAM=api:8000 for Caddy. Do not also run native uvicorn.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://phoe:${POSTGRES_PASSWORD}@postgres:5432/phoe_lone
      REDIS_URL: redis://redis:6379/0
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    mem_limit: 512m
    cpus: 0.70
    volumes:
      - ./data:/app/data:ro

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://phoe:${POSTGRES_PASSWORD}@postgres:5432/phoe_lone
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    mem_limit: 256m
    cpus: 0.50

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phoe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: phoe_lone
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
      - -c
      - effective_cache_size=384MB
      - -c
      - wal_buffers=4MB
      - -c
      - random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoe -d phoe_lone"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    expose:
      - "5432"
    mem_limit: 256m
    cpus: 0.40

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "100"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    expose:
      - "6379"
    mem_limit: 80m
    cpus: 0.20

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-phoelone.thukha.online}
      ACME_EMAIL: ${ACME_EMAIL}
      API_UPSTREAM: api:8000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.20

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
